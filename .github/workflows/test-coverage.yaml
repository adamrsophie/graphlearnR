name: test-coverage

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TORCH_INSTALL: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::covr, any::xml2, any::pkgload, symcompR=?ignore, modelcompR=?ignore
          needs: coverage

      - name: Install optional sibling packages (their tests and chunks skip without them)
        continue-on-error: true
        run: pak::pkg_install(c("adamrsophie/symcompR", "adamrsophie/modelcompR"))
        shell: Rscript {0}

      - name: Check LibTorch
        run: if (!torch::torch_is_installed()) torch::install_torch()
        shell: Rscript {0}

      - name: Run tests
        run: |
          options(testthat.progress.max_fails = 1000)
          res <- testthat::test_local(reporter = testthat::ProgressReporter$new(show_praise = FALSE),
                                      stop_on_failure = TRUE)
        shell: Rscript {0}

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          print(cov)
          covr::to_cobertura(cov, filename = "cobertura.xml")
        shell: Rscript {0}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
